# ─────────────────────────────────────────────────────────────────────────────
# Redis for RDO ONE — this is a DATASTORE, not a cache.
#
# aster:agent-key:*  (lib/agent-keystore.ts:20) is written with NO EXPIRY. Lose
# it and every EXTRA-mode user has to re-approve an Aster agent, one wallet
# signature each. aster:tpsl-watch holds pending TP/SL protections for resting
# limit orders — losing those is a silent loss of protection, not an error
# anyone sees. Default Redis settings plus an anonymous volume would drop all
# of it on the first `docker compose down`.
#
# Mounted read-only; the password is NOT in this file (see docker-compose.yml).
# ─────────────────────────────────────────────────────────────────────────────

# ── Durability ──────────────────────────────────────────────────────────────
# AOF is the half that actually matters. RDB snapshots alone can lose the
# minutes since the last checkpoint, and the save rules below never fire at all
# for a handful of writes — which is exactly the shape of this workload.
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# everysec: at most ~1s of writes lost on a hard power cut, with none of the
# per-write fsync cost of `always`. `no` would hand durability back to the OS
# page cache and defeat the point.
appendfsync everysec

# Do not stop serving reads/writes while a rewrite fsyncs. Slightly weaker
# durability during the rewrite window, but the alternative is user-visible
# stalls on a box this small.
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB kept ON alongside AOF. It is not the recovery mechanism — it is what
# makes a cheap off-box copy possible (deploy/backup-redis.sh copies dump.rdb).
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb

# Must match the named volume mount in docker-compose.yml. A wrong path here is
# the classic silent-data-loss bug: Redis writes happily to the container's
# writable layer and the volume stays empty.
dir /data

# If a snapshot cannot be written, refuse writes rather than pretend they are
# safe. Turns a silent durability failure into a loud one.
stop-writes-on-bgsave-error yes

# ── Memory ──────────────────────────────────────────────────────────────────
# noeviction, deliberately. The default (and every allkeys-* policy) would let
# Redis evict aster:agent-key:* to make room for throwaway cached market data —
# destroying user keys to cache a price. Better to fail writes loudly.
# Cache entries here set their own TTLs, so they expire without needing this.
maxmemory 512mb
maxmemory-policy noeviction

# ── Network ─────────────────────────────────────────────────────────────────
# Reachable only on the internal Compose network; no ports are published to the
# host. requirepass is still set (via the command line, see docker-compose.yml)
# so that a future container on the same network cannot read agent keys just by
# being adjacent.
bind 0.0.0.0
protected-mode no

# ── Logging ─────────────────────────────────────────────────────────────────
# stdout so Docker's json-file driver captures it and the size cap in
# docker-compose.yml applies. A logfile path here would write inside the
# container, uncapped, and eventually fill the disk.
logfile ""
loglevel notice
